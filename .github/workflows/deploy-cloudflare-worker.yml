name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Worker secrets
        run: |
          set -euo pipefail

          put_required_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is missing in the GitHub Production environment secrets"
              exit 1
            fi
            printf '%s' "$value" | npx wrangler secret put "$name" --config worker/wrangler.toml
          }

          put_required_secret KIRAPAY_API_KEY
          put_required_secret KIRAPAY_WEBHOOK_SECRET
          put_required_secret ORGANIZER_PASSCODE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KIRAPAY_API_KEY: ${{ secrets.KIRAPAY_API_KEY }}
          KIRAPAY_WEBHOOK_SECRET: ${{ secrets.KIRAPAY_WEBHOOK_SECRET }}
          ORGANIZER_PASSCODE: ${{ secrets.ORGANIZER_PASSCODE }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply kirapass-db --remote --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Register KiraPay webhook
        run: npm run kirapay:webhook:register
        env:
          KIRAPAY_API_KEY: ${{ secrets.KIRAPAY_API_KEY }}
          KIRAPAY_WEBHOOK_SECRET: ${{ secrets.KIRAPAY_WEBHOOK_SECRET }}
          KIRAPAY_WEBHOOK_URL: https://kirapass-api.dimer133745.workers.dev/api/webhooks/kirapay
          KIRAPAY_BASE_URL: https://api.kira-pay.com/api
